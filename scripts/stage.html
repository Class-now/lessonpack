<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LessonPack demo stage</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;background:#e9eef5;font:18px/1.5 system-ui,'Segoe UI',sans-serif;color:#13202f}
.side{width:440px}
.side h1{font-size:40px;margin:0 0 8px}
.side p{font-size:21px;margin:0 0 14px}
.tag{display:inline-block;background:#0b57a4;color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:16px;margin:0 6px 8px 0}
.tag.off{background:#a3201a}
.phone{width:376px;height:700px;border:12px solid #1d2329;border-radius:36px;overflow:hidden;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.25);position:relative}
.phone iframe{width:100%;height:100%;border:0}
.bar{position:absolute;top:0;left:0;right:0;height:22px;background:#1d2329;color:#fff;font-size:12px;display:flex;justify-content:space-between;padding:0 14px;z-index:2}
.phone iframe{margin-top:22px;height:calc(100% - 22px)}
</style>
</head>
<body>
<div class="side">
  <h1 id="s-title">LessonPack</h1>
  <p id="s-text">The lesson file on the learner's phone.</p>
  <div id="s-tags"><span class="tag off">Wi-Fi off</span><span class="tag off">No mobile data</span><span class="tag">23 KB file</span></div>
</div>
<div class="phone" aria-label="Phone screen"><div class="bar"><span>9:41</span><span>✈ offline</span></div><iframe id="app" title="Lesson file on the phone"></iframe></div>
<script>
var q = new URLSearchParams(location.search);
document.getElementById("app").src = q.get("src");
if (q.get("title")) document.getElementById("s-title").textContent = q.get("title");
if (q.get("text")) document.getElementById("s-text").textContent = q.get("text");
if (q.get("size")) document.querySelectorAll(".tag")[2].textContent = q.get("size") + " file";
</script>
</body>
</html>
